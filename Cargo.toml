[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
phaedrus_dom = { path = "crates/phaedrus_dom" }
phaedrus_luau = { path = "crates/phaedrus_luau" }
rbx_dom_weak = "4"
rbx_binary = "3"
rbx_xml = "3"
rbx_reflection_database = "3"
rbx_types = "3"
mlua = { version = "0.12", features = ["luau", "vendored", "macros"] }
glam = "0.30"
anyhow = "1"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The wasm script editor, built by crates/phaedrus/build.rs.
[profile.script-editor]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 4
